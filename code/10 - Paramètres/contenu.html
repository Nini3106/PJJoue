<section class="ecran" id="parametres">
    <div class="page-entete">
     <h1>
      Paramètres
     </h1>
     <p>
      Adapte l’affichage et le son à ton confort d’utilisation.
     </p>
    </div>
    <div class="formulaire-grille">
     <div class="parametre parametres-choix parametre-son">
      <div class="choix-libelle">
       Son
      </div>
      <select aria-hidden="true" class="natif-masque" id="sonActif" tabindex="-1">
       <option value="true">
        Activé
       </option>
       <option value="false">
        Désactivé
       </option>
      </select>
      <div class="choix-groupe" data-groupe-choix="sonActif" data-selection-visuelle="au-clic">
       <button id="boutonSonActive" class="choix-bouton" data-valeur="true" type="button">
        Activé
       </button>
       <button id="boutonSonDesactive" class="choix-bouton" data-valeur="false" type="button">
        Désactivé
       </button>
      </div>
     </div>
     <div class="parametre parametre-volume">
      <label for="volumeSon">
       Volume
      </label>
      <input class="curseur" id="volumeSon" max="1" min="0" step="0.05" type="range"/>
     </div>
     <div class="parametre parametres-choix">
      <div class="choix-libelle">
       Taille du texte
      </div>
      <select aria-hidden="true" class="natif-masque" id="echelleTexte" tabindex="-1">
       <option value="0.9">
        Compacte
       </option>
       <option value="1">
        Normale
       </option>
       <option value="1.15">
        Grande
       </option>
      </select>
      <div class="choix-groupe" data-groupe-choix="echelleTexte" data-selection-visuelle="au-clic">
       <button id="boutonTailleTexteCompacte" class="choix-bouton" data-valeur="0.9">
        Compacte
       </button>
       <button id="boutonTailleTexteNormale" class="choix-bouton" data-valeur="1">
        Normale
       </button>
       <button id="boutonTailleTexteGrande" class="choix-bouton" data-valeur="1.15">
        Grande
       </button>
      </div>
     </div>
     <div class="parametre parametres-actions-carte">
      <div class="parametres-actions-boutons">
       <button class="principal" data-ecran="accueil" id="boutonEnregistrerEtRevenir">
        Enregistrer et revenir
       </button>
       <button class="danger" id="boutonReinitialiserTouteLaProgression">
        Réinitialiser toute la progression
       </button>
      </div>
     </div>
    </div>
   </section>
