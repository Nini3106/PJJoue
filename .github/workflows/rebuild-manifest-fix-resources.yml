name: Rebuild manifest fix resources session

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    if: github.head_ref == 'fix/pause-reprise-ressources-evaluation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruire le manifeste
        run: python outils/construire_manifeste.py
      - name: Enregistrer le manifeste
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFESTE.json
          git commit -m "Mettre à jour le manifeste du correctif ressources"
          git push origin HEAD:${{ github.head_ref }}
