name: Valider Parcours indexable et ajustements visuels

on:
  push:
    branches: [feat/parcours-indexable-menu-accueil-fond-clair]

permissions:
  contents: write

concurrency:
  group: parcours-indexable-menu-accueil-fond-clair
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: 405bff72f6388400e0ebfb80c44beecb5d1d2729
      SCRIPT_SHA: 8890fa817f29cd43e1d37ec782f262020c9251a2
    steps:
      - name: Repartir exactement de main
        uses: actions/checkout@v4
        with:
          ref: 405bff72f6388400e0ebfb80c44beecb5d1d2729
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les outils
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          npm ci
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          mkdir -p test-results/parcours-indexable

      - name: Charger les scripts de validation figés
        run: |
          set -euo pipefail
          git fetch origin feat/parcours-indexable-menu-accueil-fond-clair
          git cat-file -e "$SCRIPT_SHA^{commit}"
          git show "$SCRIPT_SHA:.github/scripts/patch_parcours_indexable.py" > "$RUNNER_TEMP/patch.py"
          git show "$SCRIPT_SHA:.github/scripts/verify_parcours_indexable.py" > "$RUNNER_TEMP/verify.py"
          python -m py_compile "$RUNNER_TEMP/patch.py" "$RUNNER_TEMP/verify.py"

      - name: Modifier les sources
        run: python "$RUNNER_TEMP/patch.py"

      - name: Reconstruire site SEO et manifeste
        run: |
          set -euo pipefail
          npm run build:site
          npm run build:seo
          npm run build:site
          npm run build:manifeste

      - name: Vérifier précisément les trois demandes
        run: python "$RUNNER_TEMP/verify.py"

      - name: Exécuter toute la suite de tests
        run: |
          set -euo pipefail
          npm test 2>&1 | tee test-results/parcours-indexable/npm-test.log
          git diff --check

      - name: Préparer le commit validé
        run: |
          set -euo pipefail
          npm run controle:construction
          npm run controle:seo
          npm run controle:manifeste
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name "Dev'Ines"
          git config user.email "129184531+Nini3106@users.noreply.github.com"
          git add --update
          git commit -m "Indexer Parcours CJPM et ajuster la navigation"
          git push origin HEAD:refs/heads/feat/parcours-indexable-menu-accueil-fond-clair-ready
          git rev-parse HEAD | tee test-results/parcours-indexable/commit.txt
          git show --stat --oneline HEAD | tee test-results/parcours-indexable/fichiers.txt

      - name: Conserver les preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-parcours-indexable-menu-fond
          path: test-results/
          retention-days: 14
