name: Diagnostic infobulle mobile

on:
  push:
    branches:
      - professionnalisation-quiz-cjpm
    paths:
      - .github/workflows/diagnostic-infobulle.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: professionnalisation-quiz-cjpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer Playwright
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Instrumenter le test sans modifier le dépôt
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("tests/verifier_atlas.py")
          s=p.read_text(encoding="utf-8")
          old="""        bulle=page.locator('[role="tooltip"]')
        assert bulle.is_visible()
        assert bulle.evaluate('''e => {"""
          new="""        bulle=page.locator('[role="tooltip"]')
        print("DIAG_TOOLTIP", identifiant, page.evaluate(""" + "'''() => ({actif:document.activeElement?.id||'', data:document.activeElement?.dataset?.infobulle||'', nb:document.querySelectorAll('[role=tooltip]').length, infos:[...document.querySelectorAll('[role=tooltip]')].map(e=>({parent:e.parentElement?.id||e.parentElement?.className||'', texte:e.textContent, rect:e.getBoundingClientRect().toJSON(), display:getComputedStyle(e).display, visibility:getComputedStyle(e).visibility, opacity:getComputedStyle(e).opacity}))})'''" + """))
        assert bulle.is_visible()
        assert bulle.evaluate('''e => {"""
          if old not in s:
              raise SystemExit("bloc diagnostic introuvable")
          p.write_text(s.replace(old,new),encoding="utf-8")
          PY
      - name: Exécuter le contrôle Atlas
        run: python tests/verifier_atlas.py
