name: Finalize analytics parcours etapes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'analytics/parcours-etapes-lisibles' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Actualiser les empreintes et reconstruire
        run: |
          rm .github/workflows/finalize-analytics-parcours-etapes.yml
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json

          root = Path('.')
          demarrage = 'code/01 - Éléments communs/JavaScript - Démarrage et Analytics.js'
          parcours = 'code/03 - Parcours PJJ/actions-de-la-page.js'

          contrat_path = root / 'tests/atlas_integrite.json'
          contrat = json.loads(contrat_path.read_text(encoding='utf-8'))
          contrat['fichiers_metier_inchanges'][demarrage] = sha256((root / demarrage).read_bytes()).hexdigest()
          contrat_path.write_text(json.dumps(contrat, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          changements_path = root / 'tests/atlas_v1_changements_presentation.json'
          changements = json.loads(changements_path.read_text(encoding='utf-8'))
          texte = (root / parcours).read_text(encoding='utf-8')
          for modification in reversed(changements.get(parcours, [])):
              apres = modification['apres']
              avant = modification['avant']
              occurrences = modification.get('occurrences', 1)
              if texte.count(apres) != occurrences:
                  raise SystemExit(f'Impossible de recalculer l empreinte de {parcours}: {apres[:80]!r}')
              texte = texte.replace(apres, avant)

          empreintes_path = root / 'tests/atlas_v1_empreintes_presentation.json'
          empreintes = json.loads(empreintes_path.read_text(encoding='utf-8'))
          empreintes[parcours] = sha256(texte.encode('utf-8')).hexdigest()
          empreintes_path.write_text(json.dumps(empreintes, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python outils/construire_site.py
          python outils/construire_manifeste.py
      - name: Enregistrer l’état final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconstruire le suivi Analytics des parcours et étapes"
          git push origin HEAD:${{ github.head_ref }}
