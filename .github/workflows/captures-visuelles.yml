name: Captures visuelles de PJJoue

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  captures:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les outils de capture
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Contrôler les captures visuelles
        continue-on-error: true
        run: python tests/verifier_regression_visuelle.py

      - name: Conserver les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-pjjoue
          path: test-results/
          if-no-files-found: ignore
