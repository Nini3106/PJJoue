name: Valider bandeau mobile compact

on:
  push:
    branches:
      - fix/bandeau-mobile-compact

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: abc84733e94d8e6e218747b2c78d923f38f18ae6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer
        run: |
          set -euo pipefail
          npm ci
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Appliquer
        run: python .github/bandeau_mobile_patch.py

      - name: Reconstruire
        run: |
          set -euo pipefail
          npm run build:site
          npm run build:seo
          npm run build:site
          npm run build:manifeste

      - name: Verifier la cible
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path("ressources/styles/atlas-systeme.css").read_text(encoding="utf-8")
          assert "min-height:54px;" in css
          assert "padding:5px 10px;" in css
          assert "width:32px;" in css and "height:32px;" in css
          assert "min-width:82px;" in css
          assert "min-height:44px;" in css
          print("Bandeau mobile compact valide.")
          PY

      - name: Tester
        run: |
          set -euo pipefail
          npm test
          git diff --check

      - name: Creer le commit pret
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          rm -f .github/bandeau_mobile_patch.py .github/workflows/bandeau-mobile.yml
          git reset --soft "$BASE_SHA"
          git config user.name "Dev'Ines"
          git config user.email "129184531+Nini3106@users.noreply.github.com"
          git add -A
          git commit -m "Compacter le bandeau du menu mobile"
          git push --force origin HEAD:refs/heads/fix/bandeau-mobile-compact-ready
