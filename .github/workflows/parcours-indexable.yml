name: Parcours CJPM indexable

on:
  push:
    branches:
      - fix/parcours-indexable-accueil-beige-clair

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: 405bff72f6388400e0ebfb80c44beecb5d1d2729
    steps:
      - name: Recuperer main
        uses: actions/checkout@v4
        with:
          ref: 405bff72f6388400e0ebfb80c44beecb5d1d2729
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          npm ci
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Modifier les sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          root = Path.cwd()

          p = root / "code/01 - Éléments communs/gabarit-page-principale.html"
          s = p.read_text(encoding="utf-8")
          old = '<nav aria-label="Navigation principale" class="navigation q-nav">\n<button data-ecran="parcours" id="boutonParcoursPJJ" type="button">Parcours CJPM</button>'
          new = '<nav aria-label="Navigation principale" class="navigation q-nav">\n<button data-ecran="accueil" id="boutonAccueil" type="button">Accueil</button>\n<button data-ecran="parcours" id="boutonParcoursPJJ" type="button">Parcours CJPM</button>'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          pop = '<button data-ecran="accueil" id="boutonAccueil" type="button">Accueil</button>\n<button data-ecran="progression" id="boutonProgression" type="button">Ma progression</button>'
          assert s.count(pop) == 1
          s = s.replace(pop, '<button data-ecran="progression" id="boutonProgression" type="button">Ma progression</button>', 1)
          p.write_text(s, encoding="utf-8")

          p = root / "code/01 - Éléments communs/atlas-systeme.css"
          s = p.read_text(encoding="utf-8")
          for a, b in {
              ':root { color-scheme:light; --echelle-texte:1.15; background:#eae3d5; }':
              ':root { color-scheme:light; --echelle-texte:1.15; background:#f4efe6; }',
              '--q-paper:light-dark(#eae3d5,#171d29);':
              '--q-paper:light-dark(#f4efe6,#171d29);',
              '--q-paper-profond:light-dark(#ddd3bf,#121925);':
              '--q-paper-profond:light-dark(#ebe3d6,#121925);',
          }.items():
              assert s.count(a) == 1, a
              s = s.replace(a, b, 1)
          p.write_text(s, encoding="utf-8")

          p = root / "outils/construire_site.py"
          s = p.read_text(encoding="utf-8")
          assert "import base64\n" not in s
          s = s.replace("import argparse\n", "import argparse\nimport base64\n", 1)
          marker = "def construire_javascript(plan: dict) -> str:\n"
          assert s.count(marker) == 1
          function = textwrap.dedent(r"""
          def construire_page_parcours_indexable(page_principale: str) -> str:
              titre = "Parcours CJPM : quiz de justice pénale des mineurs"
              description = (
                  "Choisis parmi 5 parcours CJPM pour réviser la justice pénale des mineurs, "
                  "étape par étape, avec quiz, QCM et exercices. Une option PJJ complète le jeu."
              )
              url = "https://pjjoue.fr/parcours/"
              page = page_principale
              remplacements = {
                  '<base href="./"/>': '<base href="../"/>',
                  '<body data-ecran-actif="accueil" id="qc-atlas">': '<body data-ecran-actif="parcours" id="qc-atlas">',
                  '<section class="ecran actif" id="accueil">': '<section class="ecran" id="accueil">',
                  '<section class="ecran parcours-ecran" id="parcours">': '<section class="ecran parcours-ecran actif" id="parcours">',
                  '<link href="https://pjjoue.fr/" rel="canonical"/>': f'<link href="{url}" rel="canonical"/>',
                  '<meta content="https://pjjoue.fr/" property="og:url"/>': f'<meta content="{url}" property="og:url"/>',
                  '<meta name="twitter:title" content="Quiz CJPM : réviser la justice pénale des mineurs"/>':
                      f'<meta name="twitter:title" content="{html.escape(titre, quote=True)}"/>',
                  '<meta name="twitter:description" content="Révise le CJPM avec des quiz, QCM et exercices sur la justice pénale des mineurs. 5 parcours CJPM et une option PJJ. Site indépendant et non officiel."/>':
                      f'<meta name="twitter:description" content="{html.escape(description, quote=True)}"/>',
              }
              for ancien, nouveau in remplacements.items():
                  if page.count(ancien) != 1:
                      raise ErreurConstruction(f"Parcours indexable : repère invalide : {ancien}")
                  page = page.replace(ancien, nouveau, 1)

              def meta(page_html: str, nom: str, valeur: str, attribut: str = "name") -> str:
                  motif = re.compile(rf'<meta\s+content="[^"]*"\s+{attribut}="{re.escape(nom)}"\s*/>', re.I)
                  nouveau = f'<meta content="{html.escape(valeur, quote=True)}" {attribut}="{nom}"/>'
                  page_html, n = motif.subn(nouveau, page_html, count=1)
                  if n != 1:
                      raise ErreurConstruction(f"Parcours indexable : meta {nom} introuvable.")
                  return page_html

              page = meta(page, "description", description)
              page = meta(page, "og:title", titre, "property")
              page = meta(page, "og:description", description, "property")
              page, n = re.subn(r"<title>.*?</title>", f"<title>{html.escape(titre)}</title>", page, count=1, flags=re.S)
              if n != 1:
                  raise ErreurConstruction("Parcours indexable : title introuvable.")

              motif = re.compile(r'(<script type="application/ld\+json">)(.*?)(</script>)', re.S | re.I)
              m = motif.search(page)
              if not m:
                  raise ErreurConstruction("Parcours indexable : JSON-LD introuvable.")
              ancien = m.group(2)
              donnees = {
                  "@context":"https://schema.org",
                  "@type":["WebPage","LearningResource"],
                  "@id":url+"#webpage",
                  "url":url,
                  "name":titre,
                  "description":description,
                  "inLanguage":"fr-FR",
                  "dateModified":"2026-09-22",
                  "isPartOf":{"@type":"WebSite","@id":"https://pjjoue.fr/#website","name":"Quiz CJPM","url":"https://pjjoue.fr/"},
                  "about":{"@type":"Thing","name":"Code de la justice pénale des mineurs","alternateName":"CJPM"},
                  "learningResourceType":["Quiz","QCM","Exercices"],
                  "educationalUse":["Révision","Autoévaluation"],
                  "author":{"@type":"Person","name":"Dev'Ines"},
              }
              nouveau = json.dumps(donnees, ensure_ascii=False, separators=(",", ":")).replace("<", "\\u003c")
              return motif.sub(lambda x: x.group(1)+nouveau+x.group(3), page, count=1)


          """)
          s = s.replace(marker, function + marker, 1)

          import re
          motif_route = re.compile(
              r'(    for route in routes\.values\(\):\n'
              r'        route = route\.strip\("/"\)\n'
              r'        )if not route:(\n        +continue\n)'
          )
          s, n = motif_route.subn(r'\1if not route or route == "parcours":\2', s, count=1)
          assert n == 1, "Boucle des relais introuvable"

          old = '    ajouter("index.html", construire_page_principale(plan))\n\n    for sortie, contenu in construire_relais_routes().items():'
          new = '    page_principale = construire_page_principale(plan)\n    ajouter("index.html", page_principale)\n    ajouter("parcours/index.html", construire_page_parcours_indexable(page_principale))\n\n    for sortie, contenu in construire_relais_routes().items():'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          p = root / "outils/construire_seo.py"
          s = p.read_text(encoding="utf-8")
          assert s.count('    sorties = {"index.html"}\n') == 1
          s = s.replace('    sorties = {"index.html"}\n', '    sorties = {"index.html", "parcours/index.html"}\n', 1)
          old = '    chemins = {route.strip("/") for route in routes.values() if route.strip("/")}\n'
          new = '    chemins = {route.strip("/") for route in routes.values() if route.strip("/") and route.strip("/") != "parcours"}\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '    if sortie == "index.html":\n        if analyse.h1 < 1:\n            raise SystemExit("ÉCHEC SEO — l’accueil doit conserver au moins un H1.")\n'
          new = '    if sortie in {"index.html", "parcours/index.html"}:\n        if analyse.h1 < 1:\n            raise SystemExit(f"ÉCHEC SEO — {sortie} doit conserver au moins un H1.")\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          p = root / "code/seo-pages.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert len(data["pages"]) == 21
          data["pages"].insert(1, {"sortie":"parcours/index.html","url":"https://pjjoue.fr/parcours/","lastmod":"2026-09-22"})
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")

          # 5) Mettre à jour uniquement les garde-fous devenus obsolètes par ces choix.
          p = root / "tests/test_seo_routes.py"
          t = p.read_text(encoding="utf-8")
          old = '        attendus = {f"{route}/index.html" for route in routes.values() if route}\n'
          new = '        attendus = {f"{route}/index.html" for route in routes.values() if route and route != "parcours"}\n'
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          old = '        for route in routes.values():\n            if route:\n                self.assertNotIn(f"https://pjjoue.fr/{route}/</loc>", sitemap)\n'
          new = '        for route in routes.values():\n            if route and route != "parcours":\n                self.assertNotIn(f"https://pjjoue.fr/{route}/</loc>", sitemap)\n        self.assertIn("https://pjjoue.fr/parcours/</loc>", sitemap)\n'
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          p.write_text(t, encoding="utf-8")

          p = root / "tests/test_atlas_integrite.py"
          t = p.read_text(encoding="utf-8")
          old = "        for couleur in ['#eae3d5','#ddd3bf','#ffffff','#172d48','#214fba','#f3d86c']:\n"
          new = "        for couleur in ['#f4efe6','#ebe3d6','#ffffff','#172d48','#214fba','#f3d86c']:\n"
          assert t.count(old) == 1
          p.write_text(t.replace(old, new, 1), encoding="utf-8")

          p = root / "outils/auditer_accessibilite_statique.py"
          t = p.read_text(encoding="utf-8")
          old = '        # index.html regroupe plusieurs écrans dynamiques, chacun avec son propre h1.\n        if (nom == "index.html" and analyse.titres_h1 < 1) or (nom != "index.html" and analyse.titres_h1 != 1):\n'
          new = '        # Les deux entrées de l’application regroupent plusieurs écrans dynamiques, chacun avec son propre h1.\n        applications = {"index.html", "parcours/index.html"}\n        if (nom in applications and analyse.titres_h1 < 1) or (nom not in applications and analyse.titres_h1 != 1):\n'
          assert t.count(old) == 1
          p.write_text(t.replace(old, new, 1), encoding="utf-8")

          p = root / "tests/verifier_atlas.py"
          t = p.read_text(encoding="utf-8")
          old = "    assert page.evaluate(\"getComputedStyle(document.querySelector('#qc-atlas')).backgroundColor\")=='rgb(234, 227, 213)'\n"
          new = "    assert page.evaluate(\"getComputedStyle(document.querySelector('#qc-atlas')).backgroundColor\")=='rgb(244, 239, 230)'\n"
          assert t.count(old) == 1
          p.write_text(t.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Construire
        run: |
          set -euo pipefail
          npm run build:site
          npm run build:seo
          npm run build:site
          npm run build:manifeste

      - name: Verifier la cible
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path.cwd()
          parcours=(root/"parcours/index.html").read_text(encoding="utf-8")
          index=(root/"index.html").read_text(encoding="utf-8")
          sitemap=(root/"sitemap.xml").read_text(encoding="utf-8")
          assert 'noindex,follow' not in parcours
          assert 'https://pjjoue.fr/parcours/' in parcours
          assert '<meta http-equiv="refresh"' not in parcours
          assert '<body data-ecran-actif="parcours"' in parcours
          assert '<section class="ecran parcours-ecran actif" id="parcours">' in parcours
          assert sitemap.count("<loc>") == 22
          assert '<loc>https://pjjoue.fr/parcours/</loc>' in sitemap
          assert index.count('id="boutonAccueil"') == 1
          assert '#f4efe6' in (root/"ressources/styles/atlas-systeme.css").read_text(encoding="utf-8")
          assert len(json.loads((root/"code/seo-pages.json").read_text())["pages"]) == 22
          print("Cible valide.")
          PY

      - name: Tester
        run: |
          set -euo pipefail
          npm test
          git diff --check

      - name: Commit pret
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name "Dev'Ines"
          git config user.email "129184531+Nini3106@users.noreply.github.com"
          git add --update
          git commit -m "Indexer Parcours CJPM et eclaircir l interface"
          git push origin HEAD:refs/heads/fix/parcours-indexable-accueil-beige-clair-ready
