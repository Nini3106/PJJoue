name: Valider menu mobile

on:
  push:
    branches:
      - feat/menu-mobile-depliant

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: 1e7b56af0409520cae790cb1375d3c0be3bdbf05
    steps:
      - name: Recuperer la branche de travail
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer
        run: |
          set -euo pipefail
          npm ci
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Appliquer les modifications
        run: python .github/menu_mobile_patch.py

      - name: Reconstruire
        run: |
          set -euo pipefail
          npm run build:site
          npm run build:seo
          npm run build:site
          npm run build:manifeste

      - name: Verifier la cible
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path.cwd()
          index=(root/"index.html").read_text(encoding="utf-8")
          css=(root/"ressources/styles/atlas-systeme.css").read_text(encoding="utf-8")
          assert index.count('class="menu-mobile-seulement" data-ecran=') == 5
          assert 'content:"Menu"' in css
          assert 'border-top:4px solid var(--q-yellow)' in css
          assert '.q-nav > :is(button,a):not(.bouton-menu-mobile) { display:none; }' in css
          assert '.menu-mobile-seulement { display:flex; }' in css
          assert '#qc-atlas :is(.menu-mobile-seulement,.menu-mobile-separateur){display:none}' in css
          print("Menu mobile cible valide.")
          PY

      - name: Tester
        run: |
          set -euo pipefail
          npm test
          git diff --check

      - name: Creer le commit pret
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          rm -f .github/menu_mobile_patch.py .github/workflows/menu-mobile.yml
          git reset --soft "$BASE_SHA"
          git config user.name "Dev'Ines"
          git config user.email "129184531+Nini3106@users.noreply.github.com"
          git add -A
          git commit -m "Ajouter un menu depliant harmonise sur mobile"
          git push --force origin HEAD:refs/heads/feat/menu-mobile-depliant-ready
