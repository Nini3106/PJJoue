name: Validation SEO invisible Quiz CJPM

on:
  push:
    branches: [seo/quiz-cjpm-20260922-validation]

permissions:
  contents: write

concurrency:
  group: seo-invisible-20260922
  cancel-in-progress: true

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: 4dc36329d6a735583722445710fe2ce23abb5686
      PATCH_SHA: 9bd766183e212390b0bc23d38fd4729417278cee
      VALIDATION_SHA: 7b0d11ddbc11e9217049c3ba08e34e9b208fb3b3
    steps:
      - name: Repartir exactement de la dernière version de main
        uses: actions/checkout@v4
        with:
          ref: 4dc36329d6a735583722445710fe2ce23abb5686
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installer les outils sans modifier les dépendances du projet
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          npm ci
          python -m pip install -r requirements-dev.txt PyYAML
          python -m playwright install --with-deps chromium
          mkdir -p test-results/seo
      - name: Reprendre le même correctif déjà testé et corriger uniquement le banc de capture
        shell: python
        run: |
          import os, subprocess, yaml
          from pathlib import Path
          raw = subprocess.check_output(['git','show',os.environ['VALIDATION_SHA']+':.github/workflows/seo-invisible-20260922.yml']).decode('utf-8')
          previous = yaml.safe_load(raw)
          steps = {step.get('name'):step for step in previous['jobs']['seo']['steps'] if step.get('name')}
          bootstrap = steps['Charger le correctif et le garde-fou depuis leur version figée']['run']
          exec(compile(bootstrap,'bootstrap-valide.py','exec'), {'__name__':'__main__'})
          visual = steps['Comparer les captures bureau et mobile à la version de départ']['run']
          old = "context.route('**/*',lambda route,folder=folder:serve(folder,route))"
          new = "context.route('**/*',lambda route:serve(folder,route))"
          assert visual.count(old)==1
          visual = visual.replace(old,new)
          compile(visual,'verifier-captures.py','exec')
          (Path(os.environ['RUNNER_TEMP'])/'verifier-captures.py').write_text(visual,encoding='utf-8')
          (Path('test-results/seo')/'validation-initiale.txt').write_text('La version de départ 4dc36329d6a735583722445710fe2ce23abb5686 et ce même correctif SEO ont déjà passé npm test dans le run 35705100293. Le seul échec concernait le gestionnaire du banc de capture, corrigé ici. Le résultat SEO est reconstruit et retesté intégralement.\n',encoding='utf-8')
      - name: Appliquer le SEO et reconstruire les fichiers publics
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/patch-seo.py"
          npm run build:site
          npm run build:seo
          npm run build:site
          npm run build:manifeste
          python "$RUNNER_TEMP/verifier-invariance.py"
      - name: Comparer les captures bureau et mobile à la version de départ
        run: python "$RUNNER_TEMP/verifier-captures.py"
      - name: Exécuter toute la suite de tests active sur le résultat final
        run: |
          set -euo pipefail
          npm test 2>&1 | tee test-results/seo/apres.log
          git diff --check
      - name: Préparer un commit vérifié sans publier sur main
        run: |
          set -euo pipefail
          npm run controle:construction
          npm run controle:seo
          npm run controle:manifeste
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name "Dev'Ines"
          git config user.email "129184531+Nini3106@users.noreply.github.com"
          git add --update
          git commit -m "Renforcer le SEO Quiz CJPM sans modification visible"
          git push origin HEAD:refs/heads/seo/quiz-cjpm-20260922-ready
          git rev-parse HEAD | tee test-results/seo/commit.txt
          git show --stat --oneline HEAD | tee test-results/seo/fichiers.txt
      - name: Conserver les preuves de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-seo-invisible-20260922
          path: test-results/
          retention-days: 14
