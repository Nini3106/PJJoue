name: Finalize evaluation final milestone

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'design/evaluation-jalon-final-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruire le site et le manifeste
        run: |
          rm .github/workflows/finalize-evaluation-jalon.yml
          python outils/construire_site.py
          python outils/construire_manifeste.py
      - name: Enregistrer les fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconstruire le jalon final des évaluations"
          git push origin HEAD:${{ github.head_ref }}
